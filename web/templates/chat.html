<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURA Forge Chat v1</title>
    <style>
        /* ============================================================
           NEURA FORGE CHAT v1 — Dark Theme
           ============================================================ */
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a28;
            --bg-hover: #22223a;
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.3);
            --accent-dim: #5a3fcc;
            --text-primary: #e8e8f0;
            --text-secondary: #9898b0;
            --text-muted: #686880;
            --border: #2a2a40;
            --user-bubble: #2a1a5a;
            --assistant-bubble: #1a1a2e;
            --danger: #ff5c5c;
            --success: #5cff8a;
            --warning: #ffcc5c;
            --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 18px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .sidebar-header .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .new-chat-btn {
            margin: 12px 16px;
            padding: 10px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .new-chat-btn:hover {
            background: var(--accent-dim);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conv-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-bottom: 2px;
            transition: all 0.15s;
            position: relative;
        }
        .conv-item:hover { background: var(--bg-hover); }
        .conv-item.active {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent);
        }
        .conv-item .title {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .conv-item .meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
        }
        .model-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success);
        }
        .status-dot.offline { background: var(--danger); }
        .status-dot.demo { background: var(--warning); }

        /* Main Chat Area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
        }
        .chat-header .conv-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .chat-header .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .personality-selector {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .personality-selector:focus { outline: none; border-color: var(--accent); }

        /* Messages */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .welcome .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .welcome h2 {
            color: var(--text-secondary);
            font-size: 24px;
            margin-bottom: 8px;
        }
        .welcome p {
            font-size: 14px;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .welcome .features {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .welcome .feature-badge {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .message-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .message-row.user { flex-direction: row-reverse; }

        .message-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .message-avatar.user {
            background: var(--accent);
        }
        .message-avatar.assistant {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .message-bubble.user {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }
        .message-bubble.assistant {
            background: var(--assistant-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message-bubble p { margin-bottom: 8px; }
        .message-bubble p:last-child { margin-bottom: 0; }

        /* Markdown styling */
        .message-bubble strong { color: var(--accent); }
        .message-bubble code {
            background: rgba(124, 92, 255, 0.1);
            border: 1px solid rgba(124, 92, 255, 0.2);
            border-radius: 4px;
            padding: 1px 6px;
            font-family: var(--font-mono);
            font-size: 12px;
        }
        .message-bubble pre {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin: 8px 0;
            overflow-x: auto;
        }
        .message-bubble pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 12px;
        }

        .message-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: right;
        }
        .message-row.user .message-time { text-align: left; }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        .input-wrapper textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 14px;
            resize: none;
            max-height: 150px;
            min-height: 48px;
            line-height: 1.5;
            transition: all 0.2s;
        }
        .input-wrapper textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover {
            background: var(--accent-dim);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.05);
        }
        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .input-tools {
            display: flex;
            gap: 4px;
            padding: 4px 0 0 0;
            font-size: 11px;
            color: var(--text-muted);
        }
        .input-tools span {
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .input-tools span:hover {
            background: var(--bg-hover);
            color: var(--text-secondary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message-bubble { max-width: 90%; }
            .chat-header { padding: 12px 16px; }
            .messages-area { padding: 16px; }
            .input-area { padding: 12px 16px; }
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 20px;
            font-size: 13px;
            color: var(--text-primary);
            box-shadow: var(--shadow);
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>✦ NEURA</h1>
                <div class="subtitle">Forge Chat v1 — Magyar AI</div>
            </div>
            
            <button class="new-chat-btn" onclick="newConversation()">
                ✨ Új beszélgetés
            </button>
            
            <div class="conv-list" id="convList">
                <div class="conv-item" style="text-align:center;color:var(--text-muted);padding:20px;">
                    Betöltés...
                </div>
            </div>
            
            <div class="sidebar-footer">
                <div class="model-status" id="modelStatus">
                    <div class="status-dot offline"></div>
                    <span>Modell betöltése...</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-area">
            <!-- Header -->
            <div class="chat-header">
                <div class="conv-title" id="convTitle">Új beszélgetés</div>
                <div class="controls">
                    <select class="personality-selector" id="personalitySelect" onchange="changePersonality(this.value)">
                        <option value="default">🎭 Alap</option>
                        <option value="tudós">🔬 Tudós</option>
                        <option value="költő">🌹 Költő</option>
                        <option value="tanár">📚 Tanár</option>
                        <option value="haver">😎 Haver</option>
                    </select>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages-area" id="messagesArea">
                <div class="welcome">
                    <div class="logo">✦</div>
                    <h2>NEURA Forge Chat</h2>
                    <p>Szabadon beszélgethetsz velem!<br>
                    Kérdezz bármit, vagy csak társalogj.</p>
                    <div class="features">
                        <span class="feature-badge">🎭 5 személyiség</span>
                        <span class="feature-badge">💾 Beszélgetés mentés</span>
                        <span class="feature-badge">📜 Előzmények</span>
                        <span class="feature-badge">🔧 /parancsok</span>
                    </div>
                </div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <div class="input-row">
                    <div class="input-wrapper">
                        <textarea id="messageInput" rows="1" 
                                  placeholder="Írj valamit... (Enter = küldés, Shift+Enter = új sor)"
                                  onkeydown="handleKey(event)"
                                  oninput="autoResize(this)"></textarea>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        ➤
                    </button>
                </div>
                <div class="input-tools">
                    <span onclick="insertCommand('/help')">/help</span>
                    <span onclick="insertCommand('/new')">/new</span>
                    <span onclick="insertCommand('/personalities')">/personalities</span>
                    <span onclick="insertCommand('/model')">/model</span>
                    <span onclick="insertCommand('/datetime')">/datetime</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        // NEURA FORGE CHAT v1 — Chat Client
        // ============================================================

        let currentConvId = null;
        let isStreaming = false;
        let abortController = null;

        // ── Init ─────────────────────────────────────────────

        async function init() {
            try {
                const res = await fetch('/api/info');
                const info = await res.json();
                
                // Model status
                const statusEl = document.getElementById('modelStatus');
                if (info.model?.loaded) {
                    statusEl.innerHTML = '<div class="status-dot"></div><span>Modell: ' + 
                        (info.model.checkpoint || 'betöltve') + '</span>';
                } else {
                    statusEl.innerHTML = '<div class="status-dot demo"></div><span>Demo mód (modell nélkül)</span>';
                }
                
                // Current conversation
                if (info.current_conv) {
                    currentConvId = info.current_conv;
                    loadConversation(currentConvId);
                }
                
                // Personality
                if (info.current_personality) {
                    document.getElementById('personalitySelect').value = info.current_personality;
                }
                
                // Load conversation list
                loadConversations();
            } catch (e) {
                console.error('Init error:', e);
            }
        }

        // ── Conversations ────────────────────────────────────

        async function loadConversations() {
            try {
                const res = await fetch('/api/conversations');
                const convs = await res.json();
                const list = document.getElementById('convList');
                
                if (convs.length === 0) {
                    list.innerHTML = '<div class="conv-item" style="text-align:center;color:var(--text-muted);padding:20px;">Nincs még beszélgetés</div>';
                    return;
                }
                
                list.innerHTML = convs.map(c => `
                    <div class="conv-item ${c.id === currentConvId ? 'active' : ''}" 
                         onclick="switchConversation('${c.id}')">
                        <div class="title">${escapeHtml(c.title || 'Új beszélgetés')}</div>
                        <div class="meta">${c.message_count || 0} üzenet</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Load convs error:', e);
            }
        }

        async function newConversation() {
            try {
                const personality = document.getElementById('personalitySelect').value;
                const res = await fetch('/api/conversations', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({personality})
                });
                const conv = await res.json();
                currentConvId = conv.id;
                document.getElementById('convTitle').textContent = 'Új beszélgetés';
                document.getElementById('messagesArea').innerHTML = `
                    <div class="welcome">
                        <div class="logo">✦</div>
                        <h2>Új beszélgetés</h2>
                        <p>Mit szeretnél megbeszélni?</p>
                    </div>
                `;
                loadConversations();
            } catch (e) {
                console.error('New conv error:', e);
            }
        }

        async function switchConversation(convId) {
            try {
                currentConvId = convId;
                loadConversation(convId);
                loadConversations();
            } catch (e) {
                console.error('Switch conv error:', e);
            }
        }

        async function loadConversation(convId) {
            try {
                const res = await fetch('/api/conversations/' + convId);
                const data = await res.json();
                const conv = data.conversation;
                const messages = data.messages || [];
                
                document.getElementById('convTitle').textContent = conv?.title || 'Beszélgetés';
                
                const area = document.getElementById('messagesArea');
                
                if (messages.length === 0) {
                    area.innerHTML = '<div class="welcome"><div class="logo">✦</div><h2>Új beszélgetés</h2><p>Kezdj el beszélgetni!</p></div>';
                    return;
                }
                
                area.innerHTML = messages.map(m => {
                    const role = m.role === 'user' ? 'user' : 'assistant';
                    const time = m.timestamp ? new Date(m.timestamp * 1000).toLocaleTimeString('hu-HU') : '';
                    return `
                        <div class="message">
                            <div class="message-row ${role}">
                                <div class="message-avatar ${role}">
                                    ${role === 'user' ? '👤' : '✦'}
                                </div>
                                <div class="message-bubble ${role}">
                                    ${escapeHtml(m.content)}
                                    <div class="message-time">${time}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                area.scrollTop = area.scrollHeight;
            } catch (e) {
                console.error('Load conv error:', e);
            }
        }

        // ── Send / Stream ────────────────────────────────────

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || isStreaming) return;
            
            input.value = '';
            autoResize(input);
            
            const area = document.getElementById('messagesArea');
            
            // Remove welcome if present
            const welcome = area.querySelector('.welcome');
            if (welcome) welcome.remove();
            
            // Add user message
            addMessage('user', message, new Date().toLocaleTimeString('hu-HU'));
            
            // Add assistant placeholder
            const assistantMsgId = 'msg-' + Date.now();
            const assistantHtml = `
                <div class="message" id="${assistantMsgId}">
                    <div class="message-row assistant">
                        <div class="message-avatar assistant">✦</div>
                        <div class="message-bubble assistant">
                            <div class="typing-indicator">
                                <div class="typing-dot"></div>
                                <div class="typing-dot"></div>
                                <div class="typing-dot"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            area.insertAdjacentHTML('beforeend', assistantHtml);
            area.scrollTop = area.scrollHeight;
            
            isStreaming = true;
            document.getElementById('sendBtn').disabled = true;
            
            try {
                const personality = document.getElementById('personalitySelect').value;
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message,
                        conv_id: currentConvId,
                        personality,
                    })
                });
                
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';
                let buffer = '';
                
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, {stream: true});
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.chunk) {
                                    fullResponse += data.chunk;
                                    updateAssistantMessage(assistantMsgId, fullResponse);
                                }
                                
                                if (data.conv_id) {
                                    currentConvId = data.conv_id;
                                    loadConversations();
                                }
                                
                                if (data.done) {
                                    fullResponse = data.full || fullResponse;
                                    updateAssistantMessage(assistantMsgId, fullResponse);
                                    
                                    // Update title
                                    const titleEl = document.getElementById('convTitle');
                                    if (fullResponse && titleEl.textContent === 'Új beszélgetés') {
                                        titleEl.textContent = message.slice(0, 50) + (message.length > 50 ? '...' : '');
                                    }
                                }
                            } catch (e) {}
                        }
                    }
                    
                    area.scrollTop = area.scrollHeight;
                }
            } catch (e) {
                console.error('Stream error:', e);
                const msgEl = document.getElementById(assistantMsgId);
                if (msgEl) {
                    msgEl.querySelector('.message-bubble').innerHTML = '⚠️ Hiba történt a válasz közben.';
                }
            }
            
            isStreaming = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }

        function addMessage(role, content, time) {
            const area = document.getElementById('messagesArea');
            const html = `
                <div class="message">
                    <div class="message-row ${role}">
                        <div class="message-avatar ${role}">
                            ${role === 'user' ? '👤' : '✦'}
                        </div>
                        <div class="message-bubble ${role}">
                            ${escapeHtml(content)}
                            <div class="message-time">${time || ''}</div>
                        </div>
                    </div>
                </div>
            `;
            area.insertAdjacentHTML('beforeend', html);
            area.scrollTop = area.scrollHeight;
        }

        function updateAssistantMessage(msgId, text) {
            const el = document.getElementById(msgId);
            if (!el) return;
            const bubble = el.querySelector('.message-bubble');
            if (!bubble) return;
            
            // Remove typing indicator
            const typing = bubble.querySelector('.typing-indicator');
            if (typing) typing.remove();
            
            bubble.innerHTML = escapeHtml(text) + 
                `<div class="message-time">${new Date().toLocaleTimeString('hu-HU')}</div>`;
        }

        // ── Personality ──────────────────────────────────────

        async function changePersonality(name) {
            try {
                await fetch('/api/personality', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({personality: name})
                });
                showToast(`Személyiség váltva: ${name}`);
            } catch (e) {
                console.error('Personality change error:', e);
            }
        }

        // ── UI Helpers ───────────────────────────────────────

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        function insertCommand(cmd) {
            const input = document.getElementById('messageInput');
            input.value = cmd + ' ';
            input.focus();
            autoResize(input);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 2500);
        }

        // ── Keyboard shortcuts ───────────────────────────────

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('messageInput').blur();
            }
            if (e.ctrlKey && e.key === 'k') {
                e.preventDefault();
                document.getElementById('messageInput').focus();
            }
        });

        // ── Start ────────────────────────────────────────────
        init();
    </script>
</body>
</html>
